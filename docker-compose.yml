services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openscholar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openscholar}
      POSTGRES_DB: ${POSTGRES_DB:-openscholar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-openscholar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-openscholar}:${POSTGRES_PASSWORD:-openscholar}@db:5432/${POSTGRES_DB:-openscholar}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-openscholar}:${POSTGRES_PASSWORD:-openscholar}@db:5432/${POSTGRES_DB:-openscholar}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
